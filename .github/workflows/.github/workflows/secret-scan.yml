name: Secret Scan

on: [push, pull_request, workflow_dispatch]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets & personal data
        run: |
          set -e
          echo "Scanning for accidental secret commits..."
          # Patterns that must NOT appear in committed files
          PATTERNS=(
            "GEMINI_API_KEY"
            "SUPABASE_SERVICE_ROLE_KEY"
            "TELEGRAM_BOT_TOKEN"
            "GMAIL_APP_PASSWORD"
            "GH_PAT"
            "BEGIN RSA PRIVATE KEY"
            "BEGIN OPENSSH PRIVATE KEY"
            "@gmail.com"
          )
          # Allow in .env.example, docs, and this workflow (as placeholder examples)
          EXCLUDE="\.env\.example|secret-scan\.yml|HANDOVER\.md|SETUP\.md|\.gitignore"

          FAIL=0
          for pat in "${PATTERNS[@]}"; do
            # Search staged + committed files, excluding allowed files
            hits=$(git grep -I -n "$pat" -- . 2>/dev/null | grep -v -E "$EXCLUDE" || true)
            # For Gmail, require an actual address, not just the word
            if [ -n "$hits" ]; then
              # Extra check: allow GH_PAT in .env.example placeholder, but not real tokens
              if echo "$pat" | grep -q "GMAIL_APP_PASSWORD"; then
                # Real app passwords look like 'abcd efgh ijkl mnop' — if file contains that exact placeholder, allow
                real_hits=$(echo "$hits" | grep -v "your_.*_here" | grep -v "abcd efgh" || true)
                if [ -n "$real_hits" ]; then
                  echo "::error:: potential secret found for pattern $pat:"
                  echo "$real_hits"
                  FAIL=1
                fi
              else
                # For API keys etc, check if value looks real (not placeholder)
                real_hits=$(echo "$hits" | grep -v "your_.*_here" | grep -v "example" | grep -v "placeholder" || true)
                if [ -n "$real_hits" ]; then
                  echo "::error:: potential secret/personal data for pattern $pat:"
                  echo "$real_hits"
                  FAIL=1
                fi
              fi
            fi
          done

          # Also check for large personal data dumps
          if git ls-files | xargs grep -l "passport.*[0-9]\{6\}" 2>/dev/null | grep -v -E "$EXCLUDE"; then
            echo "::error:: possible passport number commit"
            FAIL=1
          fi

          if [ $FAIL -ne 0 ]; then
            echo "::error:: Secret scan FAILED — remove secrets/personal data and use GitHub Secrets / Supabase instead"
            exit 1
          fi
          echo "✅ Secret scan passed"

      - name: Check no .env committed
        run: |
          if git ls-files | grep -q "^\.env$"; then
            echo "::error:: .env is tracked — remove it and add to .gitignore"
            exit 1
          fi
          if git ls-files | grep -q "streamlit/secrets.toml"; then
            echo "::error:: secrets.toml is tracked"
            exit 1
          fi
          echo "✅ No .env tracked"
