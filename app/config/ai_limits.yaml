# Gemini free-tier configuration — verified 2026-11-03
# Live limits for YOUR key: https://aistudio.google.com/rate-limit
#
# 2026 model landscape (why the defaults below):
#  - The 2.0 family was shut down 2026-06-01.
#  - The 2.5 family is restricted to accounts that already used it; new
#    projects get 404s. Google points new projects to 3.5 Flash-Lite / 3.8 Flash. [] 
#  - New AI Studio keys are "Auth keys" starting with AQ.Ab... (the old AIza
#    standard keys are being retired).
#  - Free-tier models as of Nov 2026: gemini-3.8-flash, gemini-3.6-flash,
#    gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-3-flash-preview, Gemma 4.
#
gemini:
  # Preferred model for extraction/scoring: cheapest free high-volume option.
  model: "gemini-3.5-flash-lite"
  # If your key cannot see that model, the worker auto-picks the first
  # available model from worker/extraction/ai_provider.PREFERRED_MODELS.
  fallbacks:
    - "gemini-3.1-flash-lite"
    - "gemini-3.8-flash"
    - "gemini-3.6-flash"

  # Conservative free-tier budget (override with GEMINI_RPM_LIMIT / GEMINI_DAILY_BUDGET).
  # Google publishes no fixed table for 3.x; check AI Studio for your project.
  rpm: 12          # keep well under the free RPM ceiling to avoid 429s
  rpd: 900         # stay under the ~1000/day flash-lite range
  tpm: 250000

  # Never use these — shut down / unavailable to new projects
  retired:
    - "gemini-2.0-flash"
    - "gemini-2.0-flash-lite"
    - "gemini-1.5-flash"
    - "gemini-1.5-pro"
