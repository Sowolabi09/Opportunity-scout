# Opportunity Scout — Source Registry
# Adding a source = one YAML entry + optionally one parser file in worker/sources/
# Intervals: fast (RSS/aggregators) 10-15m, slow (university pages) 2-6h
# Respect robots.txt & ToS — if forbidden, mark enabled: false and document why.

defaults:
  user_agent: "OpportunityScout/1.0 (+https://github.com/YOU/opportunity-scout; contact: via GitHub)"
  request_timeout: 20
  rate_limit_rps: 0.5   # 1 request per 2s per domain
  max_retries: 2

sources:
  # ── Major funders & programs ──
  - id: chevening
    name: Chevening Scholarships
    type: scrape
    url: https://www.chevening.org/scholarships/
    rss: null
    schedule: slow
    interval_minutes: 360
    fields: [any]
    levels: [masters]
    enabled: true
    notes: "UK government — verify on chevening.org"

  - id: commonwealth
    name: Commonwealth Scholarships
    type: scrape
    url: https://cscuk.fcdo.gov.uk/scholarships/
    rss: null
    schedule: slow
